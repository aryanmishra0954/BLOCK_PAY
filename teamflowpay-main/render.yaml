services:
  - type: web
    name: blockpay-backend
    env: python
    buildCommand: cd backend_flask && pip install -r requirements.txt
    startCommand: cd backend_flask && gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: blockpay-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"

  - type: web
    name: blockpay-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: blockpay-backend
          property: host

databases:
  - name: blockpay-db
    plan: free
