version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: blockpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-blockpay}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-blockpay}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - blockpay-network

  backend:
    build:
      context: ./backend_flask
      dockerfile: Dockerfile
    container_name: blockpay-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-blockpay}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ALLOWED_ORIGINS: "*"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - blockpay-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blockpay-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - blockpay-network

volumes:
  postgres_data:
    name: blockpay_postgres_data

networks:
  blockpay-network:
    name: blockpay_network
    driver: bridge
